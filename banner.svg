<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a">
        <animate attributeName="stop-color" values="#0d1b2a;#1b263b;#0d1b2a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1b263b">
        <animate attributeName="stop-color" values="#1b263b;#0d1b2a;#1b263b" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="url(#bg)"/>

  <path d="M0,140 C300,180 900,100 1200,140 L1200,180 L0,180 Z" fill="#101c2c" opacity="0.6">
    <animate attributeName="d"
      values="M0,140 C300,180 900,100 1200,140 L1200,180 L0,180 Z;
              M0,150 C300,110 900,170 1200,130 L1200,180 L0,180 Z;
              M0,140 C300,180 900,100 1200,140 L1200,180 L0,180 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700"
        fill="#ffffff" text-anchor="middle" opacity="0">
    Hamza Shoaib
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.3;1" dur="2s" fill="freeze"/>
  </text>

  <text x="600" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="18"
        fill="#58A6FF" text-anchor="middle" opacity="0">
    AI &amp; ML Engineer | GenAI | Automation
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="2.5s" fill="freeze"/>
  </text>
</svg>
